# RegFactory 微服务编排（dev）
#
# ⚠️ worker（Celery + ixBrowser + 根注册脚本）不在此编排里：
#    ixBrowser 是 Windows 桌面应用、无法进 Linux 容器，且 worker 依赖根目录注册脚本。
#    → worker 在【宿主机】跑（见 SERVICES_RUN.md），连接本编排起的 redis。
#
# 本 compose 起：redis + gateway(8000) + sms(8001) + account(8002) + config(8003)
# 微服务为 DB-per-service（各自 SQLite 持久卷），彼此经 HTTP 通信。
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  config_service:
    build: .
    command: uvicorn config_service.main:app --host 0.0.0.0 --port 8003
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/config.db
    volumes: ["config_data:/data"]
    ports: ["8003:8003"]

  sms_service:
    build: .
    command: uvicorn sms_service.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/sms.db
    volumes: ["sms_data:/data"]
    ports: ["8001:8001"]

  account_service:
    build: .
    command: uvicorn account_service.main:app --host 0.0.0.0 --port 8002
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/account.db
    volumes: ["account_data:/data"]
    ports: ["8002:8002"]

  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/gateway.db
      REDIS_URL: redis://redis:6379/0
      CONFIG_SERVICE_URL: http://config_service:8003
      ACCOUNT_SERVICE_URL: http://account_service:8002
      SMS_SERVICE_URL: http://sms_service:8001
    volumes: ["gateway_data:/data"]
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      config_service:
        condition: service_started
      account_service:
        condition: service_started
      sms_service:
        condition: service_started

volumes:
  config_data:
  sms_data:
  account_data:
  gateway_data:
